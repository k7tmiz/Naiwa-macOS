name: Build macOS App

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建/更新的 Release 标签（例如 v1.2.2-macos）"
        required: true
        default: "v1.2.2-macos"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcode-select -p

      - name: Build app
        run: ./build.sh

      - name: Self-test (non-blocking)
        continue-on-error: true
        run: |
          ./.build/release/Naiwa --self-test "$RUNNER_TEMP/self-test" --assets assets
          cat "$RUNNER_TEMP/self-test/self-test.txt"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/奶蛙桌宠.app" "dist/Naiwa-macOS.zip"
          cd dist && shasum -a 256 "Naiwa-macOS.zip" | tee "Naiwa-macOS.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naiwa-macOS
          path: |
            dist/Naiwa-macOS.zip
            dist/Naiwa-macOS.zip.sha256
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "奶蛙桌宠 · macOS 移植版 ${{ env.RELEASE_TAG }}"
          body: |
            **奶蛙桌宠 · macOS 移植版（非官方）**

            本应用由 GitHub Actions 在 macOS runner 上自动构建（Apple Silicon / arm64）。

            安装：解压 `Naiwa-macOS.zip`，双击 `奶蛙桌宠.app`。
            应用为本地 ad-hoc 签名、未经 Apple 公证；首次打开若被拦截，请右键 App →「打开」，
            或执行 `xattr -dr com.apple.quarantine 奶蛙桌宠.app`。

            原项目：[yugh6/Naiwa](https://github.com/yugh6/Naiwa)（Windows 桌宠）。
            全部美术与音频素材版权归原作者 **yugh6** 所有；本仓库为非官方 macOS 移植，
            仅重写了 macOS 端程序逻辑。转载/分享请注明原作者及原项目地址，禁止冒充原创；
            用于短视频等公域传播前请联系原作者取得许可。
          files: |
            dist/Naiwa-macOS.zip
            dist/Naiwa-macOS.zip.sha256
